<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 360px;
      height: 800px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #kw {
      flex: 1;
      width: 100%;
      font-size: 16px;
      padding: 8px;
      resize: none;
      border: 1px solid #999;
    }
    .tip {
      font-size: 13px;
      color: #555;
      line-height: 1.6;
    }
  </style>
</head>
<body>
<textarea id="kw" placeholder="Do not move the plugin file. Separate multiple keywords with spaces.
示例：good morning sir"></textarea>
<div class="tip">Separate multiple keywords with spaces</div>
<script src="popup.js"></script>
</body>
</html>
